name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  SUPPORTED_POLARS_VERSIONS: "polars>=1.30,<1.40"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Test minimum bound specifically on one Python version
          - python-version: "3.11"
            polars-constraint: "polars==1.30.0"
            test-name: "minimum-bound"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@v6.4.3
      with:
        enable-cache: true  # Cache uv downloads

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Run tests
      run: |
        POLARS_CONSTRAINT="${{ matrix.polars-constraint || env.SUPPORTED_POLARS_VERSIONS }}"
        echo "🧪 Testing Python ${{ matrix.python-version }} with ${POLARS_CONSTRAINT}"

        # Show what version will be installed
        uv run --with "${POLARS_CONSTRAINT}" --python ${{ matrix.python-version }} python -c "import polars as pl; print(f'✅ Using polars {pl.__version__}')"

        # Run the actual tests
        uv run --with "${POLARS_CONSTRAINT}" --python ${{ matrix.python-version }} pytest -v --tb=short

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4.6.2
      with:
        name: test-results-py${{ matrix.python-version }}-${{ matrix.test-name || 'latest' }}
        path: |
          .pytest_cache/
          **/*test*.log