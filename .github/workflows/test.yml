name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  SUPPORTED_POLARS_VERSIONS: "polars>=1.30,<1.40"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@v6.4.3
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Run ruff linting
      run: |
        uv run --group dev ruff check .
        uv run --group dev ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Test minimum bound specifically on one Python version
          - python-version: "3.11"
            polars-constraint: "polars==1.30.0"
            test-name: "minimum-bound"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@v6.4.3
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install project with dev dependencies
      run: |
        POLARS_CONSTRAINT="${{ matrix.polars-constraint || env.SUPPORTED_POLARS_VERSIONS }}"
        echo "🧪 Testing Python ${{ matrix.python-version }} with ${POLARS_CONSTRAINT}"

        # Install project in development mode with dev dependencies and polars constraint
        uv sync --group dev --python ${{ matrix.python-version }}
        if [ -n "${{ matrix.polars-constraint }}" ]; then
          uv add --group dev "${POLARS_CONSTRAINT}" --python ${{ matrix.python-version }}
        fi

    - name: Show installed versions
      run: |
        uv run --python ${{ matrix.python-version }} python -c "import polars as pl; print(f'✅ Using polars {pl.__version__}')"
        uv run --python ${{ matrix.python-version }} python -c "import sys; print(f'🐍 Python {sys.version}')"

    - name: Run tests with coverage
      run: |
        uv run --python ${{ matrix.python-version }} pytest -v --tb=short --cov=polars_splitters --cov-report=xml --cov-report=term-missing --doctest-modules src/

    - name: Test README examples
      if: matrix.python-version == '3.12' && !matrix.polars-constraint
      run: |
        uv run --python ${{ matrix.python-version }} python -c "
        from pathlib import Path
        from mktestdocs import check_md_file

        fpath = Path('.') / 'README.md'
        check_md_file(fpath=fpath, lang='python')
        print('✅ README examples tested successfully')
        "

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12' && !matrix.polars-constraint
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4.6.2
      with:
        name: test-results-py${{ matrix.python-version }}-${{ matrix.test-name || 'latest' }}
        path: |
          .pytest_cache/
          **/*test*.log
          coverage.xml